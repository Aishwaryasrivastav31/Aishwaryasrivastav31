name: Update profile card

on:
  push:
    branches: [main]
    paths: [update_card.py, .github/workflows/update.yml]
  schedule:
    - cron: "17 2 * * *"      # once a day
  workflow_dispatch:           # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python update_card.py
        env:
          # Optional: add a secret called PROFILE_TOKEN to count private repos too.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit the new card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
